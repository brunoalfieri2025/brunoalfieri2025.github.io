<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0758a6">
  <title>Convite Miguel Velozo Alfieri</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;background:#0758a6;font-family:Arial,Helvetica,sans-serif}
    body{min-height:100vh}
    .page{min-height:100svh;width:100%;display:flex;align-items:flex-start;justify-content:center}
    .invite-wrap{width:min(100vw,863px);position:relative;background:#fff;box-shadow:0 18px 60px rgba(0,0,0,.30)}
    .invite-art{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}

    .video-slot{
      position:absolute;left:6.2%;top:42.0%;width:87.7%;height:25.5%;
      border-radius:3.2%;overflow:hidden;background:#071523;
      box-shadow:0 0 0 3px rgba(35,150,246,.9),0 10px 25px rgba(0,0,0,.25)
    }
    .video-slot video{display:block;width:100%;height:100%;object-fit:contain;background:#071523}
    .video-hint{
      position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
      width:74px;height:74px;border-radius:50%;display:grid;place-items:center;
      background:rgba(255,255,255,.95);color:#0b63bd;font-size:34px;font-weight:900;
      box-shadow:0 10px 30px rgba(0,0,0,.28);pointer-events:none;transition:.2s
    }
    .video-slot.playing .video-hint{opacity:0}

    .map-link{
      position:absolute;left:17.4%;top:81.25%;width:65.3%;height:6.4%;
      border-radius:999px;display:block;z-index:5;-webkit-tap-highlight-color:transparent
    }
    .map-link:focus-visible{outline:4px solid #fff;outline-offset:2px}

    @media(max-width:700px){
      .invite-wrap{box-shadow:none}
      .video-hint{width:60px;height:60px;font-size:28px}
    }
  </style>
</head>
<body>
  <main class="page" aria-label="Convite de aniversário de Miguel">
    <div class="invite-wrap">
      <img class="invite-art" src="pagina2.png"
           alt="Convite Miguel Velozo Alfieri, 1 ano, dia 27 de setembro de 2026 às 14:30, Travessa Igarapé Primavera, 313">

      <div class="video-slot" id="videoSlot">
        <video id="inviteVideo" controls playsinline preload="metadata">
          <source src="video.mp4" type="video/mp4">
          Seu navegador não suporta vídeo HTML5.
        </video>
        <span class="video-hint" aria-hidden="true">▶</span>
      </div>

      <a class="map-link"
         href="https://share.google/RATroQ6fF8vEOdBfI"
         target="_blank" rel="noopener noreferrer"
         aria-label="Abrir localização no mapa"></a>
    </div>
  </main>

  <script>
    const video = document.getElementById('inviteVideo');
    const slot = document.getElementById('videoSlot');
    video.addEventListener('play', () => slot.classList.add('playing'));
    video.addEventListener('pause', () => slot.classList.remove('playing'));
    video.addEventListener('ended', () => slot.classList.remove('playing'));
  </script>
</body>
</html>
