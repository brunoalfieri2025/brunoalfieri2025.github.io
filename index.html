<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b5faf">
  <title>Convite Miguel Velozo Alfieri</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;background:#0a5fab;font-family:Arial,Helvetica,sans-serif}
    body{min-height:100vh}
    .screen{display:none;min-height:100svh;width:100%;align-items:flex-start;justify-content:center;background:#0a5fab}
    .screen.active{display:flex}

    /* CAPA */
    .cover-wrap{width:min(100vw,1366px);position:relative;margin:auto;box-shadow:0 18px 60px rgba(0,0,0,.28)}
    .cover-link{display:block;position:relative;width:100%;text-decoration:none;-webkit-tap-highlight-color:transparent;cursor:pointer}
    .cover-link img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none}
    .cover-link::after{content:"";position:absolute;left:28%;right:28%;bottom:1.5%;height:25%;border-radius:30px;box-shadow:0 0 0 0 rgba(255,255,255,.0);animation:pulse 1.8s ease-in-out infinite;pointer-events:none}
    @keyframes pulse{50%{box-shadow:0 0 0 11px rgba(255,255,255,.13),0 0 28px rgba(255,255,255,.24)}}

    /* SEGUNDA PÁGINA */
    #convite{background:#0758a6;padding:0}
    .invite-wrap{width:min(100vw,863px);position:relative;background:#fff;box-shadow:0 18px 60px rgba(0,0,0,.30)}
    .invite-art{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}

    /* vídeo real posicionado exatamente sobre a área de vídeo da arte */
    .video-slot{position:absolute;left:6.2%;top:42.0%;width:87.7%;height:25.5%;border-radius:3.2%;overflow:hidden;background:#071523;box-shadow:0 0 0 3px rgba(35,150,246,.9),0 10px 25px rgba(0,0,0,.25)}
    .video-slot video{display:block;width:100%;height:100%;object-fit:contain;background:#071523}
    .video-hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:74px;height:74px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.95);color:#0b63bd;font-size:34px;font-weight:900;box-shadow:0 10px 30px rgba(0,0,0,.28);pointer-events:none;transition:.2s}
    .video-slot.playing .video-hint{opacity:0}

    /* botão invisível sobre o botão desenhado "VER LOCALIZAÇÃO" */
    .map-link{position:absolute;left:17.4%;top:81.25%;width:65.3%;height:6.4%;border-radius:999px;display:block;z-index:5;-webkit-tap-highlight-color:transparent}
    .map-link:focus-visible{outline:4px solid #fff;outline-offset:2px}

    .back-btn{position:fixed;left:12px;top:max(12px,env(safe-area-inset-top));z-index:20;background:rgba(0,37,78,.82);color:#fff;text-decoration:none;padding:9px 13px;border-radius:999px;font-weight:800;font-size:13px;backdrop-filter:blur(6px);-webkit-tap-highlight-color:transparent}

    @media(max-width:700px){
      .cover-wrap,.invite-wrap{box-shadow:none}
      .cover-wrap{margin:auto 0}
      .video-hint{width:60px;height:60px;font-size:28px}
    }
  </style>
</head>
<body>
  <section id="capa" class="screen active" aria-label="Capa do convite">
    <div class="cover-wrap">
      <a class="cover-link" href="#convite" id="openInvite" aria-label="Abrir o convite de Miguel">
        <img src="capa.png" alt="Capa do convite de aniversário do Miguel">
      </a>
    </div>
  </section>

  <section id="convite" class="screen" aria-label="Convite de aniversário de Miguel">
    <a class="back-btn" href="#capa">← Voltar</a>
    <div class="invite-wrap">
      <img class="invite-art" src="pagina2.png" alt="Convite Miguel Velozo Alfieri, 1 ano, dia 27 de setembro de 2026 às 14:30, Travessa Igarapé Primavera, 313">

      <div class="video-slot" id="videoSlot">
        <video id="inviteVideo" controls playsinline preload="metadata">
          <source src="video.mp4" type="video/mp4">
          Seu navegador não suporta vídeo HTML5.
        </video>
        <span class="video-hint" aria-hidden="true">▶</span>
      </div>

      <a class="map-link" href="https://share.google/RATroQ6fF8vEOdBfI" target="_blank" rel="noopener noreferrer" aria-label="Abrir localização no mapa"></a>
    </div>
  </section>

  <script>
    const screens = { capa: document.getElementById('capa'), convite: document.getElementById('convite') };
    const video = document.getElementById('inviteVideo');
    const videoSlot = document.getElementById('videoSlot');

    function showScreen(){
      const target = location.hash === '#convite' ? 'convite' : 'capa';
      screens.capa.classList.toggle('active', target === 'capa');
      screens.convite.classList.toggle('active', target === 'convite');
      window.scrollTo(0,0);
      if(target === 'capa' && !video.paused){ video.pause(); }
    }

    window.addEventListener('hashchange', showScreen);
    showScreen();

    video.addEventListener('play',()=>videoSlot.classList.add('playing'));
    video.addEventListener('pause',()=>videoSlot.classList.remove('playing'));
  </script>
</body>
</html>
