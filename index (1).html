<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0758a6"><title>Convite Miguel</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#0758a6;font-family:Arial,Helvetica,sans-serif}body{min-height:100vh}.screen{display:none;min-height:100svh;width:100%;align-items:flex-start;justify-content:center}.screen.active{display:flex}.wrap{width:min(100vw,863px);position:relative;background:#fff;box-shadow:0 18px 60px rgba(0,0,0,.3)}.art{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}.video-slot{position:absolute;left:6.2%;top:42.0%;width:87.7%;height:25.5%;border-radius:3.2%;overflow:hidden;background:#071523;box-shadow:0 0 0 3px rgba(35,150,246,.9),0 10px 25px rgba(0,0,0,.25)}.video-slot video{display:block;width:100%;height:100%;object-fit:contain;background:#071523}.hit{position:absolute;display:block;z-index:5;-webkit-tap-highlight-color:transparent;border:0;background:transparent;cursor:pointer}.map{left:11.0%;top:80.4%;width:37.7%;height:5.5%;border-radius:999px}.gift{left:51.3%;top:80.4%;width:37.7%;height:5.5%;border-radius:999px}.gift-wrap{width:min(100vw,941px);position:relative;background:#0758a6;box-shadow:0 18px 60px rgba(0,0,0,.3)}.back{left:31.0%;top:81.9%;width:44.0%;height:8.1%;border-radius:40px}.hit:focus-visible{outline:4px solid #fff;outline-offset:2px}@media(max-width:700px){.wrap,.gift-wrap{box-shadow:none}}</style></head><body>
<section id="convite" class="screen active"><div class="wrap"><img class="art" src="pagina2.png" alt="Convite de aniversário do Miguel, 1 ano, dia 27 de setembro de 2026 às 14:30, Travessa Igarapé Primavera, 313"><div class="video-slot"><video controls playsinline preload="metadata"><source src="video.mp4" type="video/mp4">Seu navegador não suporta vídeo HTML5.</video></div><a class="hit map" href="https://share.google/RATroQ6fF8vEOdBfI" target="_blank" rel="noopener noreferrer" aria-label="Ver localização"></a><button class="hit gift" type="button" aria-label="Ver sugestão de presente" onclick="showGifts()"></button></div></section>
<section id="presentes" class="screen"><div class="gift-wrap"><img class="art" src="presentes.png" alt="Sugestões de presente para Miguel: roupas inverno tamanho 1, verão tamanho 2, calçados 19/20 e brinquedos interativos"><button class="hit back" type="button" aria-label="Voltar ao convite" onclick="showInvite()"></button></div></section>
<script>function showGifts(){document.getElementById('convite').classList.remove('active');document.getElementById('presentes').classList.add('active');window.scrollTo(0,0)}function showInvite(){document.getElementById('presentes').classList.remove('active');document.getElementById('convite').classList.add('active');window.scrollTo(0,0)}</script></body></html>
